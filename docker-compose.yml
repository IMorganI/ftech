# Локальная база для разработки: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ftech
      POSTGRES_PASSWORD: ftech
      POSTGRES_DB: ftech
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftech"]
      interval: 5s
      retries: 10
volumes:
  db-data:
