name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ftech
          POSTGRES_PASSWORD: ftech
          POSTGRES_DB: ftech_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ftech" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ftech:ftech@localhost:5432/ftech_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
